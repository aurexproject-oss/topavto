<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPAVTO.si | Prodaj brez neresnih kupcev</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0b1220;
  color:white;
  text-align:center;
}

.container {
  max-width:600px;
  margin:auto;
  padding:40px 20px;
}

h1 {
  font-size:32px;
}

p {
  color:#aab7ca;
}

input, textarea {
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

button {
  padding:14px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.primary {
  background:#2563eb;
  color:white;
}

.card {
  background:#111b2d;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>Ustavi neresne kupce in prodaj hitreje</h1>

<p>
TOPAVTO ti pomaga napisati oglas in odstraniti ljudi,
ki samo sprašujejo brez namena nakupa.
</p>

<div class="card">

<input id="brand" placeholder="Znamka (npr. BMW)">
<input id="model" placeholder="Model">
<input id="price" placeholder="Cena">

<textarea id="extra" placeholder="Dodatne informacije"></textarea>

<button class="primary" onclick="generate()">Ustvari oglas</button>

</div>

<div id="result" class="card">
Tukaj se bo prikazal rezultat
</div>

</div>

<script>
function generate(){

let brand = document.getElementById("brand").value;
let model = document.getElementById("model").value;
let price = document.getElementById("price").value;
let extra = document.getElementById("extra").value;

if(!brand || !model){
  document.getElementById("result").innerText="Vnesi vsaj znamko in model.";
  return;
}

let buyers = [
  {name:"Marko", msg:"Je še na voljo?", score:45},
  {name:"Andrej", msg:"Kdaj lahko pridem?", score:88},
  {name:"Tina", msg:"Zadnja cena?", score:60}
];

let list = buyers.map(b => `
<div style="margin-top:10px;">
<strong>${b.name}</strong>: ${b.msg}<br>
<span style="color:${b.score>80?'lightgreen':b.score>60?'orange':'red'};">
${b.score}% resnost
</span>
</div>
`).join("");

document.getElementById("result").innerHTML = `
<h3>${brand} ${model}</h3>

<p>Prodamo ${brand} ${model}. Cena: ${price}</p>

<p>${extra}</p>

<hr>

<h3>Analiza kupcev</h3>

${list}

<p style="margin-top:15px; color:orange;">
🔒 PRO filtrira samo resne kupce
</p>

<a href="https://buy.stripe.com/eVqcN4dAKgo4cpA7ow2B200" target="_blank">
<button class="primary">Odkleni PRO</button>
</a>
`;
}
</script>

</body>
</html>
