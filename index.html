<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOPAVTO.si | Ustavi neresne kupce</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
  text-align:center;
}

.container {
  max-width:600px;
  margin:auto;
  padding:40px 20px;
}

h1 { font-size:28px; }
p { color:#aab7ca; }

input, textarea {
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:8px;
  border:none;
}

button {
  padding:14px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.primary {
  background:#2563eb;
  color:white;
}

.card {
  background:#111b2d;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
}

.green { color:lightgreen; }
.orange { color:orange; }
.red { color:red; }
</style>
</head>

<body>

<div class="container">

<h1>Ustavi neresne kupce in prodaj hitreje</h1>

<p>
AI ti pomaga napisati oglas in analizirati kupce,
preden izgubiš čas z njimi.
</p>

<div class="card">

<h3>1. Ustvari oglas</h3>

<input id="brand" placeholder="Znamka (npr. BMW)">
<input id="model" placeholder="Model">
<input id="price" placeholder="Cena">

<textarea id="extra" placeholder="Dodatne informacije"></textarea>

<button class="primary" onclick="generateAd()">Ustvari oglas</button>

</div>

<div id="adResult" class="card">
Tukaj se bo prikazal oglas
</div>

<div class="card">

<h3>2. Preveri kupca (AI analiza)</h3>

<textarea id="buyerMsg" placeholder="Prilepi sporočilo kupca (npr. 'zadnja cena?')"></textarea>

<button class="primary" onclick="analyzeBuyer()">Analiziraj kupca</button>

</div>

<div id="buyerResult" class="card">
Tukaj se bo prikazala analiza kupca
</div>

</div>

<script>

function generateAd(){
let brand = document.getElementById("brand").value;
let model = document.getElementById("model").value;
let price = document.getElementById("price").value;
let extra = document.getElementById("extra").value;

if(!brand || !model){
  document.getElementById("adResult").innerText="Vnesi vsaj znamko in model.";
  return;
}

document.getElementById("adResult").innerHTML = `
<h3>${brand} ${model}</h3>
<p>Prodamo ${brand} ${model}. Cena: ${price}</p>
<p>${extra}</p>

<p style="color:orange;">🔒 PRO verzija napiše bolj prodajen oglas</p>

<a href="https://buy.stripe.com/eVqcN4dAKgo4cpA7ow2B200" target="_blank">
<button class="primary">Odkleni PRO</button>
</a>
`;
}

function score(msg){
msg = msg.toLowerCase();
let s = 50;

if(msg.includes("kdaj")) s += 15;
if(msg.includes("ogled")) s += 20;
if(msg.includes("resno")) s += 20;
if(msg.includes("denar")) s += 20;
if(msg.includes("danes")) s += 10;

if(msg.includes("zadnja cena")) s -= 10;
if(msg.includes("še na voljo")) s -= 5;
if(msg.includes("menjava")) s -= 10;

if(msg.length < 15) s -= 10;
if(msg.length > 30) s += 5;

if(s > 95) s = 95;
if(s < 25) s = 25;

return s;
}

function analyzeBuyer(){
let msg = document.getElementById("buyerMsg").value;

if(!msg){
  document.getElementById("buyerResult").innerText="Prilepi sporočilo kupca.";
  return;
}

let s = score(msg);

let label = "Nizka resnost";
let color = "red";

if(s > 80){ label="Zelo resen kupec"; color="green"; }
else if(s > 60){ label="Srednje resen kupec"; color="orange"; }

document.getElementById("buyerResult").innerHTML = `
<h3>Rezultat: ${s}%</h3>

<p class="${color}">${label}</p>

<p style="margin-top:10px;">
AI ocenjuje, ali kupec resno želi kupiti ali samo sprašuje.
</p>

<p style="color:orange;">
🔒 PRO avtomatsko filtrira take kupce
</p>

<a href="https://buy.stripe.com/eVqcN4dAKgo4cpA7ow2B200" target="_blank">
<button class="primary">Odkleni PRO</button>
</a>
`;
}

</script>

</body>
</html>
